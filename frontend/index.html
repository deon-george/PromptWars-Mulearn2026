<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PromptWars — Media Verification</title>
    <style>
      :root {
        --bg: #0b0f1a;
        --panel: #111827;
        --panel-2: #0f172a;
        --line: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --brand: #22d3ee;
        --danger: #f87171;
        --warn: #fbbf24;
        --ok: #34d399;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        background: radial-gradient(1200px 800px at 10% -10%, #0b1f3a, transparent),
                    radial-gradient(1200px 800px at 110% 10%, #2a1050, transparent),
                    var(--bg);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
